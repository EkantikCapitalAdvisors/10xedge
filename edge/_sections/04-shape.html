<section class="band band--dark" id="shape" aria-labelledby="shape-title">

      <p class="eyebrow" data-reveal>THE PAYOFF SHAPE</p>
      <h2 id="shape-title" class="sec-title" data-reveal style="--d:70ms">It Bends the Payoff</h2>
      <p class="lede" data-reveal style="--d:140ms">Most assets sit on one line &mdash; more reward means more risk. A real edge steps off it.</p>
    </div>

          <title id="shape-dgw-t">Conceptual diagram: reward potential against risk of permanent loss</title>
          <desc id="shape-dgw-d">Both axes are unquantified and no values are plotted. A dotted curve, labelled the conventional frontier, runs from lower left to upper right: further right means more risk of permanent loss, further up means more reward potential. Eight asset classes sit on that curve, in rising order of risk &mdash; cash, bonds, managed futures, equities, real estate, hedge funds, private equity and venture. Retail trading sits below and to the right of the curve, in a region marked no edge or broken discipline. One larger gold point, marked THIS EDGE, sits above and to the left of the curve, annotated Sharpe about 1.4 to 1.7 and loss capped at about 1R, with a dashed line dropping from it to the curve directly below.</desc>

          <g class="shape-ax">
            <line x1="96" y1="44" x2="96" y2="520"/>
            <line x1="96" y1="520" x2="1012" y2="520"/>

          <text class="shape-t-axis" x="1012" y="560" text-anchor="end">Risk of permanent loss / ruin &rarr;</text>

      <figcaption class="shape-foot">

        <ul class="shape-key" data-reveal style="--d:160ms">

          <li class="shape-key__i">
            <svg class="shape-key__mark" viewBox="0 0 26 14" aria-hidden="true" focusable="false">
              <line class="shape-frontier" x1="1" y1="7" x2="25" y2="7"/>
            </svg>
            <span>
              <span class="shape-key__t">conventional frontier</span>
              <span class="shape-key__d">More reward is paid for with more risk of permanent loss.</span>
            </span>
          </li>

          <li class="shape-key__i">
            <svg class="shape-key__mark" viewBox="0 0 26 14" aria-hidden="true" focusable="false">

            </svg>
            <span>
              <span class="shape-key__t">no edge / broken discipline</span>
              <span class="shape-key__d">Below the line &mdash; more risk of permanent loss, less reward.</span>
            </span>
          </li>

          <li class="shape-key__i">
            <svg class="shape-key__mark" viewBox="0 0 26 14" aria-hidden="true" focusable="false">
              <circle class="shape-hero__ring" cx="13" cy="7" r="6.25"/>
              <circle class="shape-hero__dot" cx="13" cy="7" r="3.5"/>
            </svg>
            <span>
              <span class="shape-key__t shape-key__t--hero">THIS EDGE</span>
              <span class="shape-key__d">Above the line &mdash; Sharpe <span class="mono">~1.4&ndash;1.7</span> &middot; loss capped <span class="mono">~1R</span>.</span>
            </span>
          </li>

        </ul>

        <p class="attrib shape-note" data-reveal style="--d:240ms">
          Bounded loss + positive expectancy = a payoff shape almost nothing else has. Conceptual placement, conditional on the edge being real and disciplined. The Sharpe estimate (<span class="mono">~1.4&ndash;1.7</span>) is trade-derived from <span class="mono">246</span> trades called live in our Discord channel, Feb&ndash;Aug 2026, net of all costs, and is conditional on the edge persisting &mdash; not a measured long-horizon result.
        </p>

      </figcaption>
